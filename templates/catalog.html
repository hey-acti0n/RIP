<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="gradient-bg">
    <header class="container header">
      <div class="brand">
        <a href="/{{.RequestID}}" style="text-decoration: none">
          <img
            src="{{.AssetsBase}}/logo.png"
            alt="UltraRezina"
            style="
              width: 510px;
              height: 80px;
              border-radius: 8px;
              object-fit: contain;
              background: #ffffff00;
            "
          />
        </a>
      </div>
    </header>
    <main class="container">
      <section class="search-bar">
        <form method="GET" action="/" style="display: flex; align-items: center; gap: 12px; width: 100%;">
          <input
            id="q"
            name="q"
            class="input"
            type="search"
            placeholder="Поиск материала"
            value="{{.Query}}"
            style="flex: 2; min-width: 240px;"
          />
          <input
            id="thickness"
            name="thickness"
            class="input"
            type="number"
            placeholder="Толщина (мм)"
            style="flex: 1; min-width: 120px;"
            min="1"
            step="1"
            value="{{.Thickness}}"
          />
          <input
            type="hidden"
            name="requestId"
            id="requestId"
            value="{{.RequestID}}"
          />
          <button
            class="icon-btn"
            aria-label="search"
            style="background: transparent; border: none; padding: 0; margin-left: auto;"
          >
            <img
              src="{{.AssetsBase}}/search.png"
              alt="search"
              style="width: 40px; height: 40px; vertical-align: middle"
            />
          </button>
          <div class="cart-container">
            <a
              class="icon-btn"
              id="cartLink"
              href="/order/{{.RequestID}}"
              ><img
                src="{{.AssetsBase}}/cart.png"
                alt="Корзина"
                style="width: 40px; height: 40px; vertical-align: middle"
            /></a>
            <span class="cart-badge">{{.CartCount}}</span>
          </div>
        </form>
      </section>

      <section id="cards" class="grid">
        {{range .Services}}
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;">
            <h3 style="margin: 0; flex: 1;">{{.Name}}</h3>

          </div>
          <div style="margin-bottom: 15px; text-align: center;">
            <img 
              src="{{.ImageURL}}" 
              alt="{{.Name}}"
              style="
                width: 100%;
                height: 200px;
                object-fit: cover;
                border-radius: 8px;
                border: 1px solid #e0e0e0;
              "
              onerror="this.style.display='none'"
            />
          </div>
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div class="actions" style="flex: 1;">
              <a class="btn" href="/detail/{{.ID}}/{{$.RequestID}}">Подробнее</a>
              <form method="POST" action="/add" style="display:inline-block;">
                <input type="hidden" name="requestId" value="{{$.RequestID}}" />
                <input type="hidden" name="serviceId" value="{{.ID}}" />
                <button class="btn primary" type="submit">Добавить</button>
              </form>
            </div>
            <div class="muted" style="font-size: 11px; line-height: 1.3; margin-left: 15px; max-width: 200px; text-align: right;">
              {{range $i, $p := .Props}}{{if lt $i 3}}{{if $i}}<br>{{end}}{{$p}}{{end}}{{end}}
            </div>
          </div>
        </div>
        {{end}}
      </section>
    </main>
  </body>
</html>
